name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: shared, os: ubuntu-latest }
          - { module: server, os: ubuntu-latest }
          - { module: agent, os: ubuntu-latest }
          - { module: agent, os: windows-latest }
    defaults:
      run:
        working-directory: ${{ matrix.module }}
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: vet other platforms
        if: matrix.module == 'agent' && runner.os == 'Linux'
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: test
        run: go test ./...

  clickhouse:
    name: Event store on ClickHouse
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: hxtest
          CLICKHOUSE_PASSWORD: hxtestpw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - working-directory: server
        env:
          HOMEXDR_TEST_CLICKHOUSE_DSN: clickhouse://hxtest:hxtestpw@127.0.0.1:9000/homexdr_test
        run: go test -count=1 -run TestClickHouseStore -v ./internal/events

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::7} -t homexdr/server:ci .
      - name: smoke test
        run: |
          docker run -d --name hx -e HOMEXDR_SERVER_NAMES=localhost -p 8080:8080 homexdr/server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/setup/status
          docker logs hx
