# HomeXDR with ClickHouse. Copy .env.example to .env, edit it, then:
#   docker compose up -d --build
# To update automatically from git instead of rebuilding by hand, see deploy/update/.
name: homexdr

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: homexdr
      CLICKHOUSE_USER: homexdr
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      # A named volume by default; set HOMEXDR_CLICKHOUSE_DIR to a path to keep events
      # on a particular disk.
      - ${HOMEXDR_CLICKHOUSE_DIR:-clickhouse}:/var/lib/clickhouse
      - ./clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/homexdr-system-logs.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    # Not published: only the HomeXDR server talks to ClickHouse.

  homexdr:
    build:
      context: ..
    image: homexdr/server:local
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      HOMEXDR_EVENT_STORE: clickhouse
      HOMEXDR_CLICKHOUSE_DSN: clickhouse://homexdr:${CLICKHOUSE_PASSWORD}@clickhouse:9000/homexdr
      HOMEXDR_SERVER_NAMES: ${HOMEXDR_SERVER_NAMES:?set HOMEXDR_SERVER_NAMES in .env}
      HOMEXDR_AGENT_URL: ${HOMEXDR_AGENT_URL:-}
      HOMEXDR_RETENTION_DAYS: ${HOMEXDR_RETENTION_DAYS:-30}
      HOMEXDR_RETENTION_MAX_SIZE: ${HOMEXDR_RETENTION_MAX_SIZE:-}
      HOMEXDR_SECURE_COOKIES: ${HOMEXDR_SECURE_COOKIES:-false}
      HOMEXDR_SYSLOG_ALLOW: ${HOMEXDR_SYSLOG_ALLOW:-}
      # Optional AI analyst API keys (otherwise set them in the console).
      HOMEXDR_ANTHROPIC_API_KEY: ${HOMEXDR_ANTHROPIC_API_KEY:-}
      HOMEXDR_OPENAI_API_KEY: ${HOMEXDR_OPENAI_API_KEY:-}
      HOMEXDR_GEMINI_API_KEY: ${HOMEXDR_GEMINI_API_KEY:-}
      HOMEXDR_LOCAL_AI_API_KEY: ${HOMEXDR_LOCAL_AI_API_KEY:-}
      HOMEXDR_LOG_LEVEL: ${HOMEXDR_LOG_LEVEL:-info}
    ports:
      - "${HOMEXDR_CONSOLE_PORT:-8080}:8080/tcp"
      - "${HOMEXDR_AGENT_PORT:-8443}:8443/tcp"
      - "${HOMEXDR_SYSLOG_PORT:-514}:5514/udp"
      - "${HOMEXDR_SYSLOG_PORT:-514}:5514/tcp"
    volumes:
      - data:/data
      # Agent release signatures and the release public key, written by the host's update
      # script (deploy/update). Read-only: the server never holds the signing key.
      - ${HOMEXDR_SIGNATURES_DIR:-./signatures}:/usr/share/homexdr/signatures:ro
      # Optional extra Sigma rules, see rules/README.md:
      # - /opt/sigma/rules/windows/process_creation:/usr/share/homexdr/rules/sigmahq/windows:ro

volumes:
  clickhouse:
  data:
